name: Novel Collector Delivery
on:
  push:
    branches: [develop]
permissions:
  contents: write
  actions: read
concurrency:
  group: novel-collector-develop-delivery
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare verified version and commit
        run: node tools/ci-release.mjs prepare
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m venv .venv-captcha
          .venv-captcha/bin/python -m pip install -r requirements-captcha.txt
          npx playwright install --with-deps chromium
      - name: Validate full application and publication inputs
        run: |
          node tools/check-publication.mjs
          git diff --check
          export BROWSER_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          export CAPTCHA_PYTHON="$PWD/.venv-captcha/bin/python"
          sudo --preserve-env=BROWSER_PATH,CAPTCHA_PYTHON "$(command -v node)" --test --test-concurrency=4 tests/*.test.mjs
      - name: Publish pinned non-latest validation release
        run: node tools/ci-release.mjs publish
